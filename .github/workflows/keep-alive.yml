name: Keep Render App Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          curl -s https://freellmapi-5ybc.onrender.com//v1 > /dev/null
          echo "✅ Pinged freellmapi-5ybc.onrender.com/ to keep it awake!"
